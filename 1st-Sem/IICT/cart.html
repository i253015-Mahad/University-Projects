<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Mehnat</title>

    <!-- Link existing header + footer CSS -->
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* PAGE TITLE */
        .checkout-title {
            text-align: center;
            margin-top: 140px;
            font-size: 48px;
            font-weight: 700;
        }

        /* MAIN LAYOUT */
        .checkout-container {
            display: flex;
            justify-content: space-between;
            padding: 40px 70px;
        }

        /* LEFT — CART */
        .cart-box {
            width: 45%;
            background: #2f2f2f;
            border-radius: 30px;
            padding: 30px;
            color: white;
        }

        .cart-box h2 {
            font-size: 32px;
            text-decoration: underline;
            margin-bottom: 25px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .cart-item img {
            width: 120px;
            height: auto;
            border-radius: 10px;
        }

        /* RIGHT — PAYMENT */
        .payment-box {
            width: 45%;
            background: #7a7a7a;
            border-radius: 30px;
            padding: 30px;
            color: white;
        }

        .payment-box h2 {
            font-size: 32px;
            text-decoration: underline;
            margin-bottom: 25px;
        }

        .payment-box label {
            display: block;
            margin: 8px 0 3px;
        }

        .payment-box input {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
        }

        .total {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .pay-btn {
            margin-top: 20px;
            background: #222;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: black;
        }
    </style>
</head>

<body>

    <!-- HEADER LOADS HERE -->
    <div id="header-placeholder"></div>

    <h1 class="checkout-title">Checkout</h1>

    <div class="checkout-container">

        <!-- LEFT SIDE — CART -->
        <div class="cart-box">
            <h2>Your Cart:</h2>

            <div class="cart-item">
                <img src="images/helmet.jpg" alt="">
                <p><b>Safety Helmet x1</b></p>
            </div>
        </div>

        <!-- RIGHT SIDE — PAYMENT -->
        <div class="payment-box">
            <h2>Payment Details</h2>

            <label>Address:</label>
            <input type="text">

            <label>Email:</label>
            <input type="email">

            <label>Phone:</label>
            <input type="text">

            <label>Zip Code:</label>
            <input type="text">

            <p class="total">Total: Rs. 800</p>

            <button class="pay-btn">Proceed to Payment</button>
        </div>
    </div>

    <!-- FOOTER LOADS HERE -->
    <div id="footer-placeholder"></div>

    <!-- JS to load header + footer -->
    <script>
        // Load header.html
        fetch("header.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("header-placeholder").innerHTML = data;
            });

        // Load footer.html
        fetch("footer.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("footer-placeholder").innerHTML = data;
            });
    </script>
<script src="js/script.js"></script>

</body>
</html>
